# =================== SERVER CONFIG ===================
server.port=${PORT:8080}
spring.application.name=emms-system

# =================== DB CONFIG - POSTGRESQL ===================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emms_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
# =================== JPA / HIBERNATE ===================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =================== CONNECTION POOL ===================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# =================== LOGGING LEVEL ===================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.emms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

# =================== FILE UPLOAD ===================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.device-documents-dir=uploads/device-documents

# =================== JACKSON / TIMEZONE ===================
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# =================== SENDGRID ===================
sendgrid.api.key=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
sendgrid.from.email=diepyungxx@gmail.com
mail.enable=true

# =================== FRONTEND ===================
app.frontend.reset-password-url=http://localhost:5173/reset-password

# =================== APP ===================
app.name=EMMS System

# =================== OAUTH2 ===================
oauth2.redirect-uri=http://localhost:5173/oauth2/redirect
oauth2.success-redirect-url=http://localhost:5173/oauth2/redirect
oauth2.failure-redirect-url=http://localhost:5173/login
oauth2.provider=google


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_16_char_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

frontend.url=http://localhost:5173
storage.type=MINIO
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

app.reset-all-password.enabled=true
app.reset-all-password.value=123456



app.jwt.secret=${APP_JWT_SECRET:emms_system_super_secret_key_2026_local_default}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}