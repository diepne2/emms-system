# =================== SERVER CONFIG ===================
server.port=${PORT:8080}
spring.application.name=emms-system

# =================== DB CONFIG - RAILWAY POSTGRESQL ===================
spring.datasource.url=jdbc:postgresql://maglev.proxy.rlwy.net:52003/railway?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=xtmMiBQjZjIyzTZkuFPophHVFujjZtmT
spring.datasource.driver-class-name=org.postgresql.Driver

# =================== JPA / HIBERNATE ===================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =================== CONNECTION POOL ===================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# =================== LOGGING LEVEL ===================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.emms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

# =================== FILE UPLOAD ===================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.device-documents-dir=uploads/device-documents

# =================== JACKSON / TIMEZONE ===================
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# =================== SENDGRID ===================
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=diepyungxx@gmail.com
mail.enable=true

# =================== FRONTEND ===================
app.frontend.reset-password-url=http://localhost:5173/reset-password
frontend.url=http://localhost:5173

# =================== APP ===================
app.name=EMMS System

# =================== OAUTH2 ===================
oauth2.redirect-uri=http://localhost:5173/oauth2/redirect
oauth2.success-redirect-url=http://localhost:5173/oauth2/redirect
oauth2.failure-redirect-url=http://localhost:5173/login
oauth2.provider=google

# =================== MAIL ===================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
# =================== STORAGE ===================
storage.type=MINIO

# =================== RESET PASSWORD ===================
app.reset-all-password.enabled=false
app.reset-all-password.value=123456

# =================== JWT ===================
app.jwt.secret=${APP_JWT_SECRET:emms_system_super_secret_key_2026_local_default}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}



spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true